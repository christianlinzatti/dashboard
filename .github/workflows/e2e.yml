name: E2E & Screenshots

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # manuell startbar; „Screenshots aktualisieren“ startet diesen Workflow danach automatisch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright ${{ matrix.project }} (${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gleiches Image wie beim Erzeugen der Referenz-Screenshots → pixelgleiche Ergebnisse
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      # je Auflösung parallel und in Teile (Shards) zerlegt – große Auflösungen rendern ohne GPU langsamer
      # und bekommen mehr Rechner (Laufzeit vorher: 5 / 12 / 20 min)
      matrix:
        include:
          - { project: "1024x600", shard: 1, shards: 1 }
          - { project: "1280x800", shard: 1, shards: 3 }
          - { project: "1280x800", shard: 2, shards: 3 }
          - { project: "1280x800", shard: 3, shards: 3 }
          - { project: "1920x1200", shard: 1, shards: 4 }
          - { project: "1920x1200", shard: 2, shards: 4 }
          - { project: "1920x1200", shard: 3, shards: 4 }
          - { project: "1920x1200", shard: 4, shards: 4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Next.js-Build-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-e2e-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: next-e2e-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - name: Playwright-Tests mit Screenshot-Vergleich
        run: npx playwright test --trace off --project="${{ matrix.project }}" --shard="${{ matrix.shard }}/${{ matrix.shards }}"
        env:
          CI: "true"
      - name: Bericht & Diff-Bilder hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ein Gesamtergebnis (für Branch-Schutz und den schnellen Blick): grün nur, wenn alle Teile grün sind
  e2e:
    name: E2E gesamt
    needs: playwright
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Alle Teile grün?
        env:
          RESULT: ${{ needs.playwright.result }}
        run: |
          echo "Ergebnis der Playwright-Teile: $RESULT"
          test "$RESULT" = "success"

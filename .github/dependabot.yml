version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react-three:
        patterns: ["three", "@types/three", "@react-three/*"]
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
    ignore:
      # Version muss zum Container-Image in e2e.yml passen – gemeinsam von Hand aktualisieren
      - dependency-name: "@playwright/test"
      # Typen müssen zur Laufzeit passen: Node 22 (.nvmrc, CI, Raspberry Pi) – mit der Laufzeit gemeinsam anheben
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: typescript-eslint unterstützt bisher nur < 6.1 – erst anheben, wenn es TS 7 kann
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10: eslint-plugin-react (über eslint-config-next) unterstützt bisher nur bis ESLint 9
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
